version: 2

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    # The docs tools are a PEP 735 dependency group, which needs pip 25.1 or newer.
    install:
      - pip install --upgrade pip
      - pip install --group docs .
