[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
# See https://setuptools.pypa.io/en/latest/userguide/quickstart.html for more project configuration options.
name = "combustion_ble"
dynamic = ["version"]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
authors = [
    {name = "Larry Gregory", email = "lgregorydev@gmail.com"}
]
description = "SDK for communicating with Combustion Bluetooth devices"
requires-python = ">=3.14.2"
dependencies = [
  # Home Assistant installs integration requirements under its own pins, so this
  # floor must not be above the bleak version Home Assistant ships.
  "bleak>=3.0.2,<4"
]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/legrego/combustion_ble"
Repository = "https://github.com/legrego/combustion_ble"
Changelog = "https://github.com/legrego/combustion_ble/blob/main/CHANGELOG.md"
Documentation = "https://combustion_ble.readthedocs.io/"

# Development tools live in PEP 735 dependency groups, which stay out of the published
# package metadata. Install them with `pip install --group dev -e .` (pip 25.1 or newer).
[dependency-groups]
lint = [
    "ruff==0.17.6",
    "mypy==2.4.1",
    "black==26.10.1",
    "isort==9.0.2",
]
test = [
    "pytest==9.2.0",
    "pytest-sphinx==0.7.1",
    "pytest-cov==7.1.0",
]
docs = [
    "Sphinx==9.2.0",
    "furo==2025.12.19",
    "myst-parser==5.2.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-autobuild==2025.8.25",
    "sphinx-autodoc-typehints==3.17.6",
]
release = [
    "twine==7.0.0",
    "build==1.6.1",
    "packaging==26.3",
]
examples = [
    "rich==15.0.0",
]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "docs"},
    {include-group = "release"},
    {include-group = "examples"},
]

[tool.setuptools.packages.find]
exclude = [
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
    "docs*",
    "scripts*"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
combustion_ble = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "combustion_ble.version.VERSION"}

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
    | /build/
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3

# You can override these pyright settings by adding a personal pyrightconfig.json file.
[tool.pyright]
reportPrivateImportUsage = false

[tool.ruff]
line-length = 115
target-version = "py314"

[tool.ruff.lint]
# Keep the existing lint policy explicit as Ruff defaults evolve.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
# `pip install .` and `python -m build --wheel` leave a copy of the package in build/lib,
# which mypy would otherwise report as a duplicate module.
exclude = ["^build/", "^dist/"]
ignore_missing_imports = true
no_site_packages = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
strict_optional = false

[tool.coverage.run]
source = ["combustion_ble"]
branch = true

[tool.coverage.html]
directory = "test_results/cov_html"

[tool.coverage.xml]
output = "test_results/cov_xml/coverage.xml"

[tool.coverage.json]
output = "test_results/cov_json/coverage.json"

[tool.pytest.ini_options]
addopts = [
    "--junitxml=test_results/pytest.xml",
    "--cov",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-report=html",
    "--cov-report=json",
]
testpaths = "tests/"
python_classes = [
  "Test*",
  "*Test"
]
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_level = "DEBUG"
