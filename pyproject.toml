[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
# See https://setuptools.pypa.io/en/latest/userguide/quickstart.html for more project configuration options.
name = "combustion_ble"
dynamic = ["version"]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
authors = [
    {name = "Larry Gregory", email = "lgregorydev@gmail.com"}
]
description = "SDK for communicating with Combustion Bluetooth devices"
requires-python = ">=3.14.2"
dependencies = [
  "bleak>=3.1.0,<4"
]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/legrego/combustion_ble"
Repository = "https://github.com/legrego/combustion_ble"
Changelog = "https://github.com/legrego/combustion_ble/blob/main/CHANGELOG.md"
Documentation = "https://combustion_ble.readthedocs.io/"

[project.optional-dependencies]
dev = [
    "ruff==0.17.6",
    "mypy==2.4.1",
    "black==26.10.1",
    "isort==9.0.2",
    "pytest==9.2.0",
    "pytest-sphinx==0.7.1",
    "pytest-cov==7.1.0",
    "twine==7.0.0",
    "build==1.6.1",
    "Sphinx==9.2.0",
    "furo==2025.12.19",
    "myst-parser==5.2.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-autobuild==2025.8.25",
    "sphinx-autodoc-typehints==3.17.6",
    "packaging==26.3",
    "rich==15.0.0",
]

[tool.setuptools.packages.find]
exclude = [
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
    "docs*",
    "scripts*"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
combustion_ble = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "combustion_ble.version.VERSION"}

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3

# You can override these pyright settings by adding a personal pyrightconfig.json file.
[tool.pyright]
reportPrivateImportUsage = false

[tool.ruff]
line-length = 115
target-version = "py314"

[tool.ruff.lint]
# Keep the existing lint policy explicit as Ruff defaults evolve.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
ignore_missing_imports = true
no_site_packages = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
strict_optional = false

[tool.pytest.ini_options]
testpaths = "tests/"
python_classes = [
  "Test*",
  "*Test"
]
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_level = "DEBUG"
